server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HashRouter app: no rewrites needed. API + uploaded brand assets proxy to api.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
    }

    location /brand/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
