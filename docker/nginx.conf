server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HashRouter app: no rewrites needed. API + uploaded brand assets proxy to api.
    client_max_body_size 4m;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /brand/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Media paths served by the torrent streaming server (HLS playlists +
    # segments, proxied transmuxes, subtitles). Same prefix set as /streaming/.
    location ~ ^/(hlsv2|hls|mp4|subtitles)/ {
        proxy_pass http://host.docker.internal:11470;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Torrent streaming server, same-origin proxied so browser CORS and
    # mixed-content rules never apply. Upstream is the host's server on 11470
    # (host.docker.internal = host gateway on Docker Desktop).
    # Visitors then set Settings → Streaming → server address to
    # http://<this-host>/streaming/ (or the https equivalent in prod).
    location /streaming/ {
        proxy_pass http://host.docker.internal:11470/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
