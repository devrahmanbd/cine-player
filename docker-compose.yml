services:
  api:
    build: ./api
    environment:
      - PORT=3001
      # Container must listen on all interfaces: `web` reaches it via docker
      # DNS (api:3001 = container eth0 IP, not loopback). No ports are
      # published so it stays internal-only. Bare-metal defaults to 127.0.0.1.
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      - DB_DRIVER=${DB_DRIVER:-sqlite}
      - DB_PATH=${DB_PATH:-/data/brand.db}
      - UPLOADS_DIR=/data/uploads
      - MYSQL_DSN=${MYSQL_DSN:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - SITE_NAME=${SITE_NAME:-LinuxStream}
    volumes:
      - brand-data:/data
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # Optional MySQL — only used when DB_DRIVER=mysql.
  # Enable with: docker compose --profile mysql up -d
  db:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-changeme}
      - MYSQL_DATABASE=brand
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  brand-data:
  mysql-data:
